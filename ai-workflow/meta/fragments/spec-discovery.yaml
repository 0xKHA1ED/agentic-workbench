    verify: PYTHONPATH=scripts python3 -m unittest tests.test_meta_strong
    dogfood: meta/docs/dogfood/discovery-cli.md
  children:
  - id: discovery-triage
    title: review — y/n/s/e per claim
    kind: work
    status: strong

# Project tree fragment — managed by scripts/project_tree.py
nodes:
- id: discovery-skill
  title: spec-discovery skill
  kind: work
  status: strong
  data:
    pattern: .cursor/skills/spec-discovery/SKILL.md
    verify: PYTHONPATH=scripts python3 -m unittest tests.test_spec_discovery_execution
    dogfood: meta/docs/dogfood/discovery-skill.md
    contract: meta/specs/discovery-skill.md
- id: discovery-cli

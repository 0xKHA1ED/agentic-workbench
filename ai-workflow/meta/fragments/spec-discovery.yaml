      contract: meta/specs/discovery-triage.md
  - id: discovery-assemble
    title: assemble → scope-contract markdown
    kind: work
    status: strong
    data:
      pattern: scripts/spec_discovery/assemble.py
      verify: PYTHONPATH=scripts python3 -m unittest tests.test_spec_discovery_execution
      dogfood: meta/docs/dogfood/discovery-assemble.md
      contract: meta/specs/discovery-assemble.md
  - id: discovery-validate
    title: validate claims JSON schema
    kind: work
    status: strong
    data:
      pattern: scripts/spec_discovery/cli.py
      verify: PYTHONPATH=scripts python3 -m unittest tests.test_spec_discovery_execution
      dogfood: meta/docs/dogfood/discovery-validate.md
      contract: meta/specs/discovery-validate.md
- id: discovery-claims-schema
  title: Claims JSON format
  kind: work
  status: strong
  data:
    pattern: scripts/spec_discovery/model.py
    verify: PYTHONPATH=scripts python3 -m unittest tests.test_spec_discovery_execution
    dogfood: meta/docs/dogfood/discovery-claims-schema.md

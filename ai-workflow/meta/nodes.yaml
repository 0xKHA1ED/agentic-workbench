# Project tree — managed by scripts/project_tree.py
project: meta
constraints:
  codebase:
  - .
  philosophy:
  - early-steps-compound
  - tree-is-memory-not-chat
  - done-means-falsifiable-verify
  daily-loop:
  - orient
  - understand
  - spec-discovery
  - spec-contract
